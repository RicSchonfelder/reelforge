name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check (node --check)
        run: |
          find src test -name '*.mjs' -type f -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Tests
        run: npm test
