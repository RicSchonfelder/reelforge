# Reelforge — deploy no servidor (Ubuntu)
# Uso: docker compose up -d
services:
  reelforge:
    build: .
    container_name: reelforge
    restart: unless-stopped
    # Node como PID 1 não trata SIGTERM de sistema: o init reapassa o sinal
    # e o docker stop cai no SIGKILL (publicações interrompidas à toa).
    init: true
    # Rotação: evita que o log do container cresça sem limite no servidor 24/7.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4170:4170"
    env_file:
      - .env
    environment:
      # Painel acessível na rede do servidor; .env define DASHBOARD_HOST
      DASHBOARD_HOST: 0.0.0.0
      REELFORGE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./library:/app/library
      - ./editor:/app/editor
      - ./creative-matrix:/app/creative-matrix
      - ./remix:/app/remix
      - ./models:/app/models
      - ./bin:/app/bin
